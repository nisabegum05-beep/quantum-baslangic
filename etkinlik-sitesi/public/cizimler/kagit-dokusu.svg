<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Eski krem kâğıt: ince gren + yumuşak lekeler; stitchTiles sayesinde döşenince dikiş görünmez -->
  <filter id="gren" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0.55 -0.12"/>
  </filter>
  <filter id="leke" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.79  0 0 0 0 0.58  0 0 0 0 0.33  1.3 0 0 0 -0.55"/>
  </filter>
  <rect width="320" height="320" fill="#E9D4AD"/>
  <rect width="320" height="320" filter="url(#leke)" opacity="0.6"/>
  <rect width="320" height="320" filter="url(#gren)"/>
</svg>
